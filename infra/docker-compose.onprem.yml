# Indicative on-premises / private deployment (analytics zone, NOT the control network).
# Read-only OT connector feeds the historian/DMZ; this stack never writes to PLC/DCS.
services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    environment: { POSTGRES_USER: twin, POSTGRES_PASSWORD: ${DB_PASSWORD:?set}, POSTGRES_DB: twin }
    volumes: [ "twin-db:/var/lib/postgresql/data" ]
  api:
    build: ..
    environment:
      APP_ENV: production
      SECRET_KEY: ${SECRET_KEY:?set}
      DEMO_PUBLIC: "false"
      DATABASE_URL: postgresql+psycopg://twin:${DB_PASSWORD}@db/twin
      ALLOWED_ORIGINS: https://twin.plant.local
    depends_on: [db]
    ports: [ "127.0.0.1:8000:10000" ]   # expose only via TLS reverse proxy / zero-trust gateway
volumes: { twin-db: {} }
